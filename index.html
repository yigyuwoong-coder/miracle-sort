<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miracle Sort</title>
  <meta name="description" content="태양 입자가 메모리의 비트를 뒤집어 배열이 저절로 정렬되기를 기다리는 미라클 소트 시뮬레이션">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='11' cy='16' r='7' fill='%23ffd76a'/><circle cx='26' cy='16' r='3.5' fill='%235aa9ff'/></svg>">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 class="title">Miracle Sort</h1>
      <p class="tagline">태양 입자가 내 메모리의 비트를 뒤집어, 배열이 저절로 정렬될 때까지 기다린다</p>
    </div>
    <nav class="top-actions">
      <button type="button" class="share-btn" id="shareBtn">공유하기</button>
      <button type="button" class="navlink" id="donateBtn">개발자 후원</button>
      <a class="navlink" href="bench.html">해싱 성능 측정 →</a>
    </nav>
  </header>

  <main class="stage">
    <section class="sky-wrap">
      <canvas id="sky" aria-label="태양계"></canvas>

      <div class="clock" aria-live="polite">
        <div class="clock-label">지금</div>
        <div class="clock-value" id="clock">0일</div>
      </div>

      <aside class="hash-card">
        <div class="hc-title">충돌 판정 1스텝 · 실측</div>
        <div class="hc-row"><span>해싱 사용</span><b id="tHash">–</b></div>
        <div class="hc-row"><span>해싱 없이</span><b id="tBrute">–</b></div>
        <div class="hc-x" id="tX">측정 중…</div>
        <label class="hc-switch"><input type="checkbox" id="useHash" checked> 시뮬레이션에 해싱 사용</label>
      </aside>

      <div class="miracle" id="miracle" hidden>
        <div class="miracle-title">기적!</div>
        <div class="miracle-sub" id="miracleSub"></div>
        <div class="miracle-btns">
          <button type="button" id="mShare">결과 공유</button>
          <button type="button" id="mContinue" class="ghost">계속 기다리기</button>
          <button type="button" id="mRestart" class="ghost">처음부터</button>
        </div>
      </div>
    </section>

    <div class="speed-strip">
      <div class="speedbar" role="toolbar" aria-label="배속">
        <button type="button" class="play" id="play" aria-label="일시정지">❚❚</button>
        <div class="speed-group">
          <span class="group-label">정밀 계산</span>
          <div class="group-btns" id="preciseBtns"></div>
        </div>
        <div class="speed-group">
          <span class="group-label">천문 시간</span>
          <div class="group-btns" id="astroBtns"></div>
        </div>
      </div>
    </div>

    <section class="memory">
      <div class="mem-head">
        <span class="mem-title">내 메모리 <b id="memBits"></b></span>
        <div class="chips" id="nChips"></div>
        <button type="button" class="ghost small" id="restart">처음부터</button>
      </div>
      <canvas id="mem" aria-label="메모리 배열"></canvas>
    </section>
  </main>

  <dialog id="shareDialog" class="modal">
    <form method="dialog" class="modal-head">
      <h2>결과 카드</h2>
      <button value="close" aria-label="닫기">✕</button>
    </form>
    <canvas id="cardPreview" class="card-preview" aria-label="결과 카드 미리보기"></canvas>
    <div class="modal-btns">
      <button type="button" id="saveImg" class="primary">이미지 저장</button>
      <button type="button" id="shareNow">공유하기</button>
      <button type="button" id="copyLink">링크 복사</button>
    </div>
    <p class="modal-note" id="shareNote">비트 수가 클수록 등급이 올라가고 카드가 더 화려해진다.</p>
  </dialog>

  <dialog id="donateDialog" class="modal donate">
    <form method="dialog" class="modal-head">
      <h2>개발자 후원</h2>
      <button value="close" aria-label="닫기">✕</button>
    </form>
    <p class="donate-sub" id="donateSub">더 빠른 배속은 후원으로 해금된다.</p>
    <div class="donate-box">카카오톡 : 이규웅 으로 송금하세요</div>
    <form method="dialog" class="modal-btns"><button class="primary">닫기</button></form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
